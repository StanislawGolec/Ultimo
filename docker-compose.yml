version: '3.8'

services:
  ultimo-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ultimo-server:latest
    container_name: ultimo-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JAVA_OPTS=-XX:+UseZGC -XX:+ZGenerational -Xms64m -Xmx256m
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
